# docker-compose.yml — a single application container with durable SQLite storage.
services:
  browsepilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      FRONTEND_DIR: /app/frontend/dist
      PORT: "8000"
    volumes:
      - browsepilot-data:/app/data
      # The API key is read only from this file, not from container environment variables.
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    shm_size: "512mb"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/chromium-seccomp.json
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2

# Keep this volume when rebuilding or upgrading the application.
volumes:
  browsepilot-data:
